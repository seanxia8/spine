# Base configuration
base:
  world_size: 1
  iterations: 10
  seed: 0
  unwrap: false
  log_dir: .
  log_step: 1
  overwrite_log: true
  train:
    weight_prefix: snapshot
    save_step: 10
    optimizer:
      name: Adam
      lr: 0.001

# IO configuration
io:
  loader:
    batch_size: 100
    shuffle: false
    num_workers: 0
    collate_fn: all
    sampler:
      name: random_sequence
      seed: 0
    dataset:
      name: larcv
      file_keys: "/sdf/home/j/junjie/SPINE/playground/first_trial/file_list/train_file_list_short.txt"
      schema:
        data:
          parser: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          parser: sparse3d
          sparse_event: sparse3d_pcluster_semantics
        vertices:
          parser: vertex_points
          particle_event: particle_corrected
          sparse_event: sparse3d_pcluster

# Model configuration
model:
  name: uresnet
  weight_path: null

  network_input:
    data: data
  loss_input:
    seg_label: seg_label
    point_label: vertices

  modules:
    uresnet:
      num_input: 1
      num_classes: 5
      filters: 32
      depth: 5
      reps: 2
      allow_bias: false
      activation:
        name: lrelu
        negative_slope: 0.33
      norm_layer:
        name: batch_norm
        eps: 0.0001
        momentum: 0.01

    uresnet_loss:
      loss: focal_loss
      balance_loss: false
      focal_gamma: 1.5
      focal_alpha: [1.3, 0.8, 1.8, 1.8, 1.8]
