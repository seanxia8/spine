# UResNet semantic segmentation with an upweighted loss.
#
# upweight_type selects the scheme (see SegmentationLoss.process_loss_config):
#   vertex   - points within upweight_radius of a vertex (needs point_label)
#   instance - inverse class frequency, exponent <= instance_wpower
#   class    - distance to the nearest voxel of another class
# Weights are capped at upweight_cap. Set io.loader.dataset.file_keys and
# the output paths before launching a job.

base:
  world_size: 1
  epochs: 25.0
  seed: 0
  unwrap: false
  log_dir: logs/uresnet_upweight/train
  log_step: 1

train:
  weight_prefix: weights/uresnet_upweight/snapshot
  save_epoch: 1.0
  optimizer:
    provider: Adam
    lr: 0.001

io:
  loader:
    minibatch_size: 256
    shuffle: false
    num_workers: 8
    collate_fn: all
    sampler:
      provider: random_sequence
      seed: 0
    dataset:
      provider: larcv
      file_keys: null
      schema:
        data:
          provider: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          provider: sparse3d
          sparse_event: sparse3d_pcluster_semantics
        vertices:
          provider: vertex_points
          particle_event: particle_corrected
          sparse_event: sparse3d_pcluster

model:
  provider: uresnet
  weight_path: null
  network_input:
    data: data
  loss_input:
    seg_label: seg_label
    point_label: vertices
  modules:
    uresnet:
      num_input: 1
      num_classes: 5
      filters: 32
      depth: 5
      reps: 2
      allow_bias: false
      activation:
        provider: lrelu
        negative_slope: 0.33
      norm_layer:
        provider: batch_norm
        eps: 0.0001
        momentum: 0.01
    uresnet_loss:
      balance_loss: false
      upweight_points: true
      upweight_type: vertex
      upweight_radius: 15
      upweight_cap: 3
      # instance: instance_wpower: 0.3
      # class:    cdist_chunk_size: 10000
      # Alternative losses:
      #   loss: ce_dice, lambda_dice: 0.5
      #   loss: focal_loss, focal_gamma: 1.5, focal_alpha: [1.3, 0.8, 1.8, 1.8, 1.8]
