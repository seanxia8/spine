# Base configuration
base:
  world_size: 1
  iterations: 100 # 125k/256 -> 500/epoch -> 50 epochs
  seed: 0
  unwrap: false
  log_dir: /sdf/data/neutrino/junjie/SPINE/playground/attention_generic_graph_spice/loss/
  log_step: 8
  overwrite_log: true
  train:
    weight_prefix: /sdf/data/neutrino/junjie/SPINE/playground/attention_generic_graph_spice/weight/snapshot
    save_step: 500 # ~1 epoch
    accum_steps: 4
    optimizer:
      name: Adam
      lr: 0.001
  wandb:
    project: spine-graph-spice-iter
    # entity: <your-wandb-username-or-team>
    name: graph_spice_iter_k2_attn   # override per ablation run
    tags: [iterative, attention, graph_spice, mpvmpr]
    notes: "Iterative GraphSPICE with boundary attention, n_iterations=2"
    run_dir: /sdf/home/j/junjie/sdf-data/SPINE/wandb  # local wandb/ files go here, not ~
    # mode: disabled  # uncomment to suppress all W&B output locally

# IO configuration
io:
  loader:
    batch_size: 64
    shuffle: false
    num_workers: 8
    collate_fn: all
    sampler:
      #name: random_sequence
      name: sequential
      seed: 0
    dataset:
      name: larcv
      file_keys: /sdf/data/neutrino/generic/mpvmpr_2020_01_v04/train.root
      schema:
        data:
          parser: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          parser: sparse3d
          sparse_event: sparse3d_pcluster_semantics
        clust_label:
          parser: cluster3d
          cluster_event: cluster3d_pcluster
          particle_event: particle_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          add_particle_info: true
          clean_data: true
          break_clusters: true
# Model configuration
model:
  name: graph_spice_iter
  weight_path:

  network_input:
    data: data
    seg_label: seg_label
    clust_label: clust_label
  loss_input:
    seg_label: seg_label
    clust_label: clust_label

  modules:
    graph_spice:
      shapes: [shower, track, michel, delta]
      use_raw_features: true
      invert: true
      make_clusters: false
      n_iterations: 4    # 1 = single-pass baseline, 2 = one refinement, k>2 = convergence study
      use_attention: true # false = iterate without attention (ablation)
      use_confidence_mask: true # false = hard {0,-inf} mask; true = soft gate scaled by edge-score confidence
      track_iter_metrics: true # logs ari/purity/efficiency/sbd per intermediate iter to wandb
      log_step: 8             # must match base/log_step
      embedder:
        spatial_embedding_dim: 3
        feature_embedding_dim: 16
        occupancy_mode: softplus
        covariance_mode: softplus
        predict_semantics: true
        num_classes: 5
        uresnet_attn:
          num_input: 4 # 1 feature + 3 normalized coords
          filters: 32
          input_kernel: 5
          depth: 5
          reps: 2
          spatial_size: 6144
          allow_bias: false
          attn_mode: "boundary"
          use_hard_mask: true   # false = soft cluster-direction bias (Flash-compatible); true = explicit float mask (back-compat)
          checkpoint_attn: false  # gradient checkpoint the attention (saves O(N²×heads) memory, ~2x compute)
          lower:
            - 0
            - 0
            - 0
          upper:
            - 6144
            - 6144
            - 6144
          embed_dim: 256
          num_heads: 8
          attn_gain: 0.5
          activation:
            name: lrelu
            negative_slope: 0.33
          norm_layer:
            name: batch_norm
            eps: 0.0001
            momentum: 0.01
      kernel:
        name: bilinear
        num_features: 32
      constructor:
        edge_threshold: 0.1
        min_size: 3
        label_edges: true
        graph:
          name: knn
          k: 5
        orphan:
          mode: radius
          radius: 1.9
          iterate: true
          assign_all: true

    graph_spice_loss:
      name: edge
      loss: binary_log_dice_ce
      evaluate_clustering_metrics: true  # logs ari/purity/efficiency/sbd for final iter (no suffix)
